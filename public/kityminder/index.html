<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>KityMinder Editor - Iframe Integration</title>

    <link href="favicon.ico" type="image/x-icon" rel="shortcut icon" />

    <!-- 核心依赖 CSS -->
    <link rel="stylesheet" href="lib/bootstrap.css" />
    <link rel="stylesheet" href="lib/codemirror.css" />
    <link rel="stylesheet" href="lib/hotbox.css" />
    <link rel="stylesheet" href="lib/kityminder.core.css" />
    <link rel="stylesheet" href="lib/color-picker.min.css" />
    <link rel="stylesheet" href="kityminder.editor.min.css" />

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      div.minder-editor-container {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
      }
      /* 隐藏原有的标题栏（可选） */
      h1.editor-title {
        display: none;
      }
      /* 隐藏图片以及超链接相关的按钮组 */
      /* .image-btn 和 .hyperlink 是生成的按钮类名 */
      /* 我们直接隐藏它们的父级容器 btn-group-vertical */
      /* .btn-group-vertical:has(.hyperlink),  */
      .btn-group-vertical:has(.image-btn) {
        display: none !important;
      }

      .nav > li > a {
        color: #1f2937 !important;
      }
      .top-tab .nav-tabs li.active a {
        color: #2a5fbd !important;
      }

      .inline-directive a {
        color: #1f2937 !important;
      }

      .top-tab .nav-tabs {
        background-color: #f9fafb !important; /* 清新背景 */
      }

      /* 修改导航预览器（小地图）中红色的可视区域框 */
      .nav-previewer svg path[stroke="red"],
      .nav-previewer svg rect[stroke="red"] {
        stroke: #2a5fbd !important; /* 替换为你想要的主题色 */
        stroke-width: 3px !important; /* 也可以顺便调整粗细，让它更精致 */
      }

      .nav-bar {
        background: #2a5fbd;
        /* right: 10px !important;
		left: auto !important; */
      }

      .nav-bar .nav-btn.active {
        background-color: #1f3875;
      }

      /* .nav-previewer {
        right: 45px !important;
		left: auto !important;
      } */

      /* 顶部工具栏背景调整 */
      .km-editor .top-tab .nav-tabs {
        background-color: #f8fafc !important; /* 清新背景 */
        border-bottom: 1px solid #e2e8f0 !important;
      }

      .km-editor .top-tab .nav-tabs > li > a {
        color: #64748b !important;
      }

      .km-editor .top-tab .nav-tabs > li.active > a,
      .km-editor .top-tab .nav-tabs > li.active > a:hover,
      .km-editor .top-tab .nav-tabs > li.active > a:focus {
        color: #2a5fbd !important;
        background-color: #ffffff !important;
        border-bottom-color: transparent !important;
      }

      /* 按钮颜色覆盖 */
      .km-editor .km-btn-item.active,
      .km-editor .km-btn-item:active {
        background: #eff6ff !important;
        color: #2a5fbd !important;
      }

      .km-editor .km-btn-item:hover {
        background: #f1f5f9 !important;
      }

      /* 覆盖 KityMinder 默认的主题色（如果有） */
      .km-editor .km-priority-icon,
      .km-editor .km-progress-icon {
        filter: hue-rotate(10deg) saturate(1.2); /* 微调图标色调匹配 #2A5FBD */
      }

      /* 隐藏标签（资源）编辑器及相关按钮 */
      .resource-editor,
      .km-resource-editor,
      .km-btn-item[title*="标签"],
      .km-btn-item[title*="资源"] {
        display: none !important;
      }

      /* 预览模式下的样式隐藏 */
      body.preview-mode .top-tab,
      body.preview-mode .nav-bar,
      body.preview-mode .nav-previewer,
      body.preview-mode .nav-previewer-container,
      body.preview-mode .search-box,
      body.preview-mode .control-panel {
        display: none !important;
      }
      body.preview-mode .minder-editor-container {
        top: 0 !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        box-shadow: none !important;
        border: none !important;
      }
      body.preview-mode .minder-editor {
        top: 0 !important;
      }
    </style>
  </head>
  <body ng-app="kityminderDemo" ng-controller="MainController">
    <kityminder-editor on-init="initEditor(editor, minder)"></kityminder-editor>

    <!-- 核心依赖 JS -->
    <script src="lib/jquery.js"></script>
    <script src="lib/bootstrap.js"></script>
    <script src="lib/angular.js"></script>
    <script src="lib/ui-bootstrap-tpls.js"></script>
    <script src="lib/codemirror.js"></script>
    <script src="lib/xml.js"></script>
    <script src="lib/javascript.js"></script>
    <script src="lib/css.js"></script>
    <script src="lib/htmlmixed.js"></script>
    <script src="lib/markdown.js"></script>
    <script src="lib/overlay.js"></script>
    <script src="lib/gfm.js"></script>
    <script src="lib/ui-codemirror.js"></script>
    <!-- 如果 marked.js 丢失，请从此下载并放入 lib/ : https://cdn.jsdelivr.net/npm/marked/marked.min.js -->
    <script src="lib/marked.js"></script>
    <script>
      // 检查是否为预览模式
      if (window.location.search.indexOf('mode=preview') !== -1) {
        document.body.classList.add('preview-mode');
      }

      // 兼容性修正：较新版本的 marked 是一个对象而非函数，但 KityMinder 期待它是一个函数
      if (typeof marked === "object" && typeof marked.parse === "function") {
        var _marked = marked;
        window.marked = function () {
          return _marked.parse.apply(_marked, arguments);
        };
        // 保留原有的方法供可能需要的其他地方使用
        for (var key in _marked) {
          if (_marked.hasOwnProperty(key)) {
            window.marked[key] = _marked[key];
          }
        }
      }
    </script>
    <script src="lib/kity.min.js"></script>
    <script src="lib/hotbox.js"></script>
    <script src="lib/json-diff.js"></script>
    <script src="lib/kityminder.core.min.js"></script>
    <script src="lib/color-picker.min.js"></script>

    <script src="kityminder.editor.min.js"></script>

    <script>
      angular
        .module("kityminderDemo", ["kityminderEditor"])
        .config(function (configProvider) {
          // 如果有图片上传需求，请取消下方注释并配置地址
          // configProvider.set('imageUpload', '../server/imageUpload.php');
        })
        .controller("MainController", function ($scope) {
          $scope.initEditor = function (editor, minder) {
            window.editor = editor;
            window.minder = minder;

            // 告知父窗口：编辑器已就绪
            if (window.parent !== window) {
              window.parent.postMessage({ type: "ready" }, "*");
            }

            // 监听内容变化，实时向父窗口同步数据
            minder.on("contentchange", function () {
              var data = minder.exportJson();
              window.parent.postMessage(
                {
                  type: "exportJson",
                  data: data,
                },
                "*"
              );
            });
          };

          // 标记是否已经完成初始定位，并记录初始视口
          var hasInitedView = false;
          var homeView = null;

          // 监听父窗口传来的操作指令
          window.addEventListener("message", function (event) {
            var res = event.data;
            if (res.type === "importJson") {
              var isPreview = document.body.classList.contains('preview-mode');
              var lastView = (isPreview && hasInitedView) ? window.minder.getPaper().getViewPort() : null;

              window.minder.importJson(res.data);
              
              if (isPreview) {
                // 判断是否是重新开始（根节点无子节点）
                var isReset = !res.data.root || !res.data.root.children || res.data.root.children.length === 0;

                if (!hasInitedView || isReset) {
                  // 初始化或重置：校准位置
                  if (!homeView) {
                    window.minder.execCommand('camera', window.minder.getRoot(), 0);
                    var template = window.minder.getTemplate();
                    if (template === 'right' || template === 'fish-bone') {
                      var paper = window.minder.getPaper();
                      var view = paper.getViewPort();
                      view.center.x += 200; // 调整偏移量以适配 100% 缩放
                      paper.setViewPort(view);
                    }
                    homeView = window.minder.getPaper().getViewPort();
                    hasInitedView = true;
                  } else {
                    window.minder.getPaper().setViewPort(homeView);
                  }
                } else if (lastView) {
                  window.minder.getPaper().setViewPort(lastView);
                }
              }
            } else if (res.type === "appendNode") {
              // 增量添加节点逻辑，实现平滑增长
              var parentText = res.parentText;
              var nodeData = res.node;
              var targetParent = null;

              // 递归查找父节点
              window.minder.getRoot().traverse(function(node) {
                if (node.data.text === parentText) {
                  targetParent = node;
                }
              });

              if (targetParent) {
                // 执行添加节点命令
                window.minder.select(targetParent);
                // 这里调用编辑器命令添加带文字的节点
                window.minder.execCommand('AppendChildNode', nodeData.text);
                
                // 对新生成的节点设置其他属性
                if (nodeData.priority) window.minder.execCommand('Priority', nodeData.priority);
                if (nodeData.progress) window.minder.execCommand('Progress', nodeData.progress);
                if (nodeData.note) window.minder.execCommand('Note', nodeData.note);
                if (nodeData.hyperlink) window.minder.execCommand('Hyperlink', nodeData.hyperlink);
              }
            } else if (res.type === "exportJson") {
              var data = window.minder.exportJson();
              window.parent.postMessage(
                { type: "exportJson", data: data },
                "*"
              );
            } else if (res.type === "exportData") {
              // 处理多种格式导出 (png, jpg, svg, markdown, json/km)
              var format = res.format || 'json';
              window.minder.exportData(format).then(function(content) {
                window.parent.postMessage({
                  type: 'exportDataResult',
                  format: format,
                  content: content
                }, '*');
              });
            }
          });
        });
    </script>
  </body>
</html>
